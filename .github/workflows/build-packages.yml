name: Build extension packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      submit_chrome_web_store:
        description: "Upload the Chrome package to Chrome Web Store and submit it for review"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-metadata.outputs.package-version }}
      manifest-version: ${{ steps.package-metadata.outputs.manifest-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package metadata
        id: package-metadata
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./src/manifest.json').version")"
          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "manifest-version=${manifest_version}" >> "${GITHUB_OUTPUT}"

      - name: Check release version contract
        run: npm run release:version:check

      - name: Check release workflow contract
        run: npm run release:workflow:check

      - name: Check localized copy
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Chrome extension
        run: npm run build

      - name: Package Chrome extension
        run: npm run release:package

      - name: Package Firefox extension
        run: npm run firefox:package

      - name: Check Firefox lint baseline
        run: node scripts/check-firefox-lint-baseline.mjs

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: release/ai-usage-dashboard-${{ steps.package-metadata.outputs.package-version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-package
          path: release/firefox/ai_usage_dashboard-${{ steps.package-metadata.outputs.manifest-version }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release target
        id: release-target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version="${{ needs.build.outputs.package-version }}"
          manifest_version="${{ needs.build.outputs.manifest-version }}"
          release_tag="v${package_version}"
          chrome_asset="ai-usage-dashboard-chrome-${package_version}.zip"
          firefox_asset="ai-usage-dashboard-firefox-${package_version}.zip"
          release_exists="false"
          should_upload_assets="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            tag_version="${release_tag#v}"
            if [[ "${tag_version}" != "${package_version}" ]]; then
              echo "Tag version ${tag_version} does not match package.json version ${package_version}." >&2
              exit 1
            fi
            should_upload_assets="true"
          else
            if ! git ls-remote --exit-code --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${release_tag}" >/dev/null; then
              echo "Matching release tag ${release_tag} does not exist yet; skipping GitHub Release."
              echo "should-release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if ! gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Matching GitHub Release ${release_tag} does not exist yet; skipping notes refresh."
              echo "should-release=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            release_exists="true"
          fi

          if [[ "${should_upload_assets}" == "true" ]]; then
            if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              release_exists="true"
            fi
          fi

          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "chrome-asset=${chrome_asset}" >> "${GITHUB_OUTPUT}"
          echo "firefox-asset=${firefox_asset}" >> "${GITHUB_OUTPUT}"
          echo "release-exists=${release_exists}" >> "${GITHUB_OUTPUT}"
          echo "should-upload-assets=${should_upload_assets}" >> "${GITHUB_OUTPUT}"
          echo "should-release=true" >> "${GITHUB_OUTPUT}"

      - name: Download packages
        if: steps.release-target.outputs.should-upload-assets == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release notes
        if: steps.release-target.outputs.should-release == 'true'
        run: |
          set -euo pipefail

          package_version="${{ needs.build.outputs.package-version }}"
          chrome_asset="${{ steps.release-target.outputs.chrome-asset }}"
          firefox_asset="${{ steps.release-target.outputs.firefox-asset }}"

          cat > release-notes.md <<NOTES
          ## AI Usage Dashboard ${package_version}

          Release candidate package for manual review, extension-store handoff, and browser-specific testing.

          ### Downloads

          - Chrome: \`${chrome_asset}\`
            - Use this zip for Chrome Web Store upload, review, or manual developer-mode testing after extracting it.
          - Firefox local beta: \`${firefox_asset}\`
            - Unsigned local beta package generated from the Firefox manifest transform. Normal Firefox installation still needs a signed AMO/self-distribution package.
          - Checksums: \`SHA256SUMS.txt\`

          ### Notes

          - Chrome Web Store remains the recommended install path for everyday Chrome users.
          - Improves Codex current-quota refresh by discovering the signed-in ChatGPT session from the extension background worker before using the lazy page fallback.
          - Reuses one short-lived session credential and bounded request budget across popup, side panel, dashboard, and background refreshes without storing cookies or raw session responses.
          - Improves Cursor billing-summary recovery with direct background session requests while preserving the signed-in page path for bounded aggregate history and compatibility fallback.
          - Adds a compact, default-hidden Codex Flex credit item and preserves last-known-good Codex and Cursor data when provider pages are delayed or incomplete.
          - Keeps default-hidden quota items out of automatic toolbar badge rotation and normalizes relative reset countdowns for consistent popup and toolbar status.
          - Keeps provider source-truth, manifest-permission, and browser-package boundaries unchanged.
          NOTES

      - name: Prepare release assets
        if: steps.release-target.outputs.should-upload-assets == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-upload

          package_version="${{ needs.build.outputs.package-version }}"
          manifest_version="${{ needs.build.outputs.manifest-version }}"
          chrome_asset="${{ steps.release-target.outputs.chrome-asset }}"
          firefox_asset="${{ steps.release-target.outputs.firefox-asset }}"
          chrome_source="release-artifacts/chrome-extension-package/ai-usage-dashboard-${package_version}.zip"
          firefox_source="release-artifacts/firefox-extension-package/ai_usage_dashboard-${manifest_version}.zip"

          if [[ ! -f "${chrome_source}" ]]; then
            echo "Chrome package not found at ${chrome_source}." >&2
            exit 1
          fi
          if [[ ! -f "${firefox_source}" ]]; then
            echo "Firefox package not found at ${firefox_source}." >&2
            exit 1
          fi

          cp "${chrome_source}" "release-upload/${chrome_asset}"
          cp "${firefox_source}" "release-upload/${firefox_asset}"

          (
            cd release-upload
            sha256sum "${chrome_asset}" "${firefox_asset}" > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        if: steps.release-target.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
          RELEASE_TAG: ${{ steps.release-target.outputs.release-tag }}
          RELEASE_EXISTS: ${{ steps.release-target.outputs.release-exists }}
          SHOULD_UPLOAD_ASSETS: ${{ steps.release-target.outputs.should-upload-assets }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_EXISTS}" == "true" ]]; then
            if [[ "${SHOULD_UPLOAD_ASSETS}" == "true" ]]; then
              while IFS= read -r asset_name; do
                [[ -z "${asset_name}" ]] && continue
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --yes
              done < <(gh release view "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name')
            fi

            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md

            if [[ "${SHOULD_UPLOAD_ASSETS}" == "true" ]]; then
              gh release upload "${RELEASE_TAG}" release-upload/*.zip release-upload/SHA256SUMS.txt \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
            fi
          else
            if [[ "${SHOULD_UPLOAD_ASSETS}" != "true" ]]; then
              echo "Refusing to create ${RELEASE_TAG} without tag-scoped release assets." >&2
              exit 1
            fi
            release_flags=()
            if [[ "${PACKAGE_VERSION}" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release-upload/*.zip release-upload/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi

  chrome-web-store:
    name: Submit Chrome Web Store
    needs: build
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.submit_chrome_web_store)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download Chrome package
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-package
          path: release-artifacts/chrome-extension-package

      - name: Upload and submit Chrome Web Store package
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE || 'DEFAULT_PUBLISH' }}
          CWS_DEPLOY_PERCENTAGE: ${{ vars.CWS_DEPLOY_PERCENTAGE }}
          CWS_BLOCK_ON_WARNINGS: ${{ vars.CWS_BLOCK_ON_WARNINGS || 'true' }}
          CWS_CHROME_PACKAGE: release-artifacts/chrome-extension-package/ai-usage-dashboard-${{ needs.build.outputs.package-version }}.zip
        run: node ./scripts/chrome-web-store-submit.mjs --publish
