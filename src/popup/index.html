<!doctype html>
<html lang="en" class="popup-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>AI Usage Dashboard Popup</title>
    <style>
      html.popup-page,
      body.popup-page {
        margin: 0;
        width: min(
          var(--app-popup-width-preferred, 392px),
          max(var(--app-popup-width-min, 360px), 100vw)
        );
        min-width: var(--app-popup-width-min, 360px);
        max-width: var(--app-popup-width-max, 420px);
      }

      html.popup-page {
        --app-popup-width-min: 360px;
        --app-popup-width-preferred: 392px;
        --app-popup-width-max: 420px;
      }

      html.popup-page[data-popup-size-preset="compact"] {
        --app-popup-width-min: 320px;
        --app-popup-width-preferred: 344px;
        --app-popup-width-max: 360px;
      }

      html.popup-page[data-popup-size-preset="balanced"] {
        --app-popup-width-min: 360px;
        --app-popup-width-preferred: 392px;
        --app-popup-width-max: 420px;
      }

      html.popup-page[data-popup-size-preset="wide"] {
        --app-popup-width-min: 420px;
        --app-popup-width-preferred: 520px;
        --app-popup-width-max: 560px;
      }

      body.popup-page {
        overflow-x: hidden;
      }

      #root.popup-page-root {
        margin: 0;
        width: 100%;
      }
    </style>
  </head>
  <body class="popup-page">
    <div id="root" class="popup-page-root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
